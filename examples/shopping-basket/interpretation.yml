kind: spec-interpretation
version: 1
status: accepted
name: shopping-basket
description: XState-projectable interpretation of the shopping-basket example.

spec:
  path: examples/shopping-basket/shopping-basket.spec
  grammar:
    name: spec
    version: 1
  ast:
    kind: spec-ast
    version: 1

model:
  id: shopping-basket
  name: shopping basket
  description: Behavioural model for basket contents, totals, promo-code feedback, and checkout start.
  initial: empty
  context:
    productCount: 0
    productQuantity: 0
    productPrice: 0
    newProductPrice: 0
    discountAmount: 0
    hasDiscount: false
    promoCodeStatus: null
    promoCodeErrorVisible: false
    checkoutButton: disabled
    checkoutUsesBasket: false
  facts:
    - id: basket-empty
      phrase: basket is empty
      status: accepted
      sourceRefs:
        - scenario: Add a product to an empty basket
          phase: given
          clause: basket is empty
        - scenario: Checkout button is disabled for an empty basket
          phase: given
          clause: basket is empty
    - id: basket-contains-product
      phrase: basket contains product
      status: accepted
      sourceRefs:
        - scenario: Add a product to an empty basket
          phase: then
          clause: basket contains product
        - scenario: Start checkout from a non-empty basket
          phase: given
          clause: basket contains product
    - id: basket-contains-existing-product
      phrase: basket contains existing product
      status: accepted
      sourceRefs:
        - scenario: Add a second product to the basket
          phase: given
          clause: basket contains existing product
    - id: basket-contains-new-product
      phrase: basket contains new product
      status: accepted
      sourceRefs:
        - scenario: Add a second product to the basket
          phase: then
          clause: basket contains new product
    - id: basket-has-discount
      phrase: basket has discount
      status: accepted
      sourceRefs:
        - scenario: Apply a valid promo code
          phase: then
          clause: basket has discount
    - id: promo-code-valid
      phrase: promo code is valid
      status: accepted
      sourceRefs:
        - scenario: Apply a valid promo code
          phase: when
          clause: promo code is valid
    - id: promo-code-invalid
      phrase: promo code is invalid
      status: accepted
      sourceRefs:
        - scenario: Reject an invalid promo code
          phase: when
          clause: promo code is invalid
    - id: promo-code-error-visible
      phrase: promo code error is visible
      status: accepted
      sourceRefs:
        - scenario: Reject an invalid promo code
          phase: then
          clause: promo code error is visible
    - id: checkout-started
      phrase: checkout is started
      status: accepted
      sourceRefs:
        - scenario: Start checkout from a non-empty basket
          phase: then
          clause: checkout is started
    - id: checkout-uses-basket
      phrase: checkout uses basket
      status: accepted
      sourceRefs:
        - scenario: Start checkout from a non-empty basket
          phase: then
          clause: checkout uses basket
    - id: checkout-button-disabled
      phrase: checkout button is disabled
      status: accepted
      sourceRefs:
        - scenario: Checkout button is disabled for an empty basket
          phase: then
          clause: checkout button is disabled
    - id: checkout-button-enabled
      phrase: checkout button is enabled
      status: accepted
      sourceRefs:
        - scenario: Checkout button is enabled for a non-empty basket
          phase: then
          clause: checkout button is enabled
    - id: basket-total-equals-product-price
      phrase: basket total equals product price
      status: accepted
      sourceRefs:
        - scenario: Add a product to an empty basket
          phase: then
          clause: basket total equals product price
        - scenario: Basket total equals the sum of all products
          phase: then
          clause: basket total equals product price
    - id: basket-total-equals-two-products
      phrase: basket total equals existing product price plus new product price
      status: accepted
      sourceRefs:
        - scenario: Add a second product to the basket
          phase: then
          clause: basket total equals existing product price plus new product price
    - id: basket-total-reflects-quantity
      phrase: basket total equals product price multiplied by 2
      status: accepted
      sourceRefs:
        - scenario: Increase the quantity of an existing product
          phase: then
          clause: basket total equals product price multiplied by 2
    - id: basket-total-reflects-discount
      phrase: basket total equals product price minus discount amount
      status: accepted
      sourceRefs:
        - scenario: Apply a valid promo code
          phase: then
          clause: basket total equals product price minus discount amount
        - scenario: Basket total reflects discount when a promo code is applied
          phase: then
          clause: basket total equals product price minus discount amount
  states:
    - id: empty
      name: empty basket
      facts:
        - basket-empty
        - checkout-button-disabled
      status: accepted
    - id: has-product
      name: basket with one product
      facts:
        - basket-contains-product
        - checkout-button-enabled
      status: accepted
    - id: has-multiple-products
      name: basket with multiple products
      facts:
        - basket-contains-product
        - basket-contains-existing-product
        - basket-contains-new-product
        - checkout-button-enabled
      status: accepted
    - id: checking-out
      name: checkout started
      facts:
        - basket-contains-product
        - checkout-started
        - checkout-uses-basket
      status: accepted
  events:
    - id: add-product
      name: add product
      phrase: the user adds product to basket
      status: accepted
      sourceRefs:
        - scenario: Add a product to an empty basket
          phase: when
          clause: the user adds product to basket
        - scenario: Increase the quantity of an existing product
          phase: when
          clause: the user adds product to basket
    - id: add-new-product
      name: add new product
      phrase: the user adds new product to basket
      status: accepted
      sourceRefs:
        - scenario: Add a second product to the basket
          phase: when
          clause: the user adds new product to basket
    - id: decrease-product-quantity
      name: decrease product quantity
      phrase: the user decreases quantity of product
      status: accepted
      sourceRefs:
        - scenario: Decrease the quantity of a product
          phase: when
          clause: the user decreases quantity of product
        - scenario: Remove a product when its quantity reaches zero
          phase: when
          clause: the user decreases quantity of product
    - id: remove-product
      name: remove product
      phrase: the user removes product from basket
      status: accepted
      sourceRefs:
        - scenario: Remove a product from the basket
          phase: when
          clause: the user removes product from basket
    - id: submit-valid-promo-code
      name: submit valid promo code
      phrase: the user submits promo code and promo code is valid
      status: accepted
      sourceRefs:
        - scenario: Apply a valid promo code
          phase: when
          clause: the user submits promo code
        - scenario: Apply a valid promo code
          phase: when
          clause: promo code is valid
    - id: submit-invalid-promo-code
      name: submit invalid promo code
      phrase: the user submits promo code and promo code is invalid
      status: accepted
      sourceRefs:
        - scenario: Reject an invalid promo code
          phase: when
          clause: the user submits promo code
        - scenario: Reject an invalid promo code
          phase: when
          clause: promo code is invalid
    - id: start-checkout
      name: start checkout
      phrase: the user starts checkout
      status: accepted
      sourceRefs:
        - scenario: Start checkout from a non-empty basket
          phase: when
          clause: the user starts checkout
  transitions:
    - id: add-product-to-empty-basket
      name: Add a product to an empty basket
      from: empty
      event: add-product
      to: has-product
      guard:
        state: empty
      effects:
        - assign: productCount
          value: 1
        - assign: productQuantity
          value: 1
        - assign: checkoutButton
          value: enabled
        - assertFact: basket-contains-product
        - assertFact: basket-total-equals-product-price
        - clearFact: basket-empty
      status: accepted
      sourceRefs:
        - scenario: Add a product to an empty basket
    - id: add-second-product-to-basket
      name: Add a second product to the basket
      from: has-product
      event: add-new-product
      to: has-multiple-products
      guard:
        all:
          - fact: basket-contains-product
          - context: productCount
            operator: equals
            value: 1
      effects:
        - assign: productCount
          value: 2
        - assign: checkoutButton
          value: enabled
        - assertFact: basket-contains-existing-product
        - assertFact: basket-contains-new-product
        - assertFact: basket-total-equals-two-products
      status: accepted
      sourceRefs:
        - scenario: Add a second product to the basket
    - id: increase-existing-product-quantity
      name: Increase the quantity of an existing product
      from: has-product
      event: add-product
      to: has-product
      guard:
        all:
          - fact: basket-contains-product
          - context: productQuantity
            operator: equals
            value: 1
      effects:
        - assign: productCount
          value: 2
        - assign: productQuantity
          value: 2
        - assertFact: basket-total-reflects-quantity
      status: accepted
      sourceRefs:
        - scenario: Increase the quantity of an existing product
    - id: decrease-product-quantity
      name: Decrease the quantity of a product
      from: has-product
      event: decrease-product-quantity
      to: has-product
      guard:
        all:
          - fact: basket-contains-product
          - context: productQuantity
            operator: equals
            value: 2
      effects:
        - assign: productCount
          value: 1
        - assign: productQuantity
          value: 1
        - assertFact: basket-total-equals-product-price
        - clearFact: basket-total-reflects-quantity
      status: accepted
      sourceRefs:
        - scenario: Decrease the quantity of a product
    - id: remove-product-when-quantity-reaches-zero
      name: Remove a product when its quantity reaches zero
      from: has-product
      event: decrease-product-quantity
      to: empty
      guard:
        all:
          - fact: basket-contains-product
          - context: productQuantity
            operator: equals
            value: 1
      effects:
        - assign: productCount
          value: 0
        - assign: productQuantity
          value: 0
        - assign: hasDiscount
          value: false
        - assign: checkoutButton
          value: disabled
        - assertFact: basket-empty
        - assertFact: checkout-button-disabled
        - clearFact: basket-contains-product
      status: accepted
      sourceRefs:
        - scenario: Remove a product when its quantity reaches zero
    - id: remove-product-from-basket
      name: Remove a product from the basket
      from: has-product
      event: remove-product
      to: empty
      guard:
        all:
          - fact: basket-contains-product
          - context: productCount
            operator: equals
            value: 1
      effects:
        - assign: productCount
          value: 0
        - assign: productQuantity
          value: 0
        - assign: hasDiscount
          value: false
        - assign: checkoutButton
          value: disabled
        - assertFact: basket-empty
        - assertFact: checkout-button-disabled
        - clearFact: basket-contains-product
      status: accepted
      sourceRefs:
        - scenario: Remove a product from the basket
    - id: apply-valid-promo-code
      name: Apply a valid promo code
      from: has-product
      event: submit-valid-promo-code
      to: has-product
      guard:
        fact: basket-contains-product
      effects:
        - assign: hasDiscount
          value: true
        - assign: promoCodeStatus
          value: valid
        - assign: promoCodeErrorVisible
          value: false
        - assertFact: promo-code-valid
        - assertFact: basket-has-discount
        - assertFact: basket-total-reflects-discount
      status: accepted
      sourceRefs:
        - scenario: Apply a valid promo code
    - id: reject-invalid-promo-code
      name: Reject an invalid promo code
      from: has-product
      event: submit-invalid-promo-code
      to: has-product
      guard:
        fact: basket-contains-product
      effects:
        - assign: promoCodeStatus
          value: invalid
        - assign: promoCodeErrorVisible
          value: true
        - assertFact: promo-code-invalid
        - assertFact: promo-code-error-visible
        - assertFact: basket-total-equals-product-price
      status: accepted
      sourceRefs:
        - scenario: Reject an invalid promo code
    - id: start-checkout-from-non-empty-basket
      name: Start checkout from a non-empty basket
      from: has-product
      event: start-checkout
      to: checking-out
      guard:
        fact: basket-contains-product
      effects:
        - assign: checkoutUsesBasket
          value: true
        - assertFact: checkout-started
        - assertFact: checkout-uses-basket
      status: accepted
      sourceRefs:
        - scenario: Start checkout from a non-empty basket

invariants:
  - id: checkout-button-disabled-for-empty-basket
    name: Checkout button is disabled for an empty basket
    when:
      state: empty
    assert:
      - fact: checkout-button-disabled
      - context: checkoutButton
        operator: equals
        value: disabled
    status: accepted
    sourceRefs:
      - scenario: Checkout button is disabled for an empty basket
  - id: checkout-button-enabled-for-non-empty-basket
    name: Checkout button is enabled for a non-empty basket
    when:
      any:
        - state: has-product
        - state: has-multiple-products
        - state: checking-out
    assert:
      - fact: checkout-button-enabled
      - context: checkoutButton
        operator: equals
        value: enabled
    status: accepted
    sourceRefs:
      - scenario: Checkout button is enabled for a non-empty basket
  - id: basket-total-equals-sum-of-products
    name: Basket total equals the sum of all products
    when:
      fact: basket-contains-product
    assert:
      - fact: basket-total-equals-product-price
    status: accepted
    sourceRefs:
      - scenario: Basket total equals the sum of all products
  - id: basket-total-reflects-discount
    name: Basket total reflects discount when a promo code is applied
    when:
      all:
        - fact: basket-contains-product
        - fact: basket-has-discount
    assert:
      - fact: basket-total-reflects-discount
      - context: hasDiscount
        operator: equals
        value: true
    status: accepted
    sourceRefs:
      - scenario: Basket total reflects discount when a promo code is applied

ambiguities:
  - id: finite-state-vs-context-count
    phrase: basket count / product quantity
    note: Counts and quantities are represented as context rather than separate finite states to keep the state space small.
    options:
      - Keep count and quantity in context.
      - Promote count and quantity milestones to explicit finite states.
  - id: product-vs-existing-new-product
    phrase: existing product / new product
    note: The spec distinguishes product instances in some scenarios, but this interpretation keeps product identity mostly in facts and context.
    options:
      - Model product as a single scenario-local product with facts for existing and new products.
      - Model existing product and new product as separate entities in a richer future projection.
  - id: promo-code-event-splitting
    phrase: the user submits promo code / promo code is valid / promo code is invalid
    note: The current model splits valid and invalid promo-code submission into separate events because the schema does not yet model event payload guards.
    options:
      - Keep separate valid and invalid promo-code events.
      - Model one submit-promo-code event with a status payload and guard conditions.
  - id: discount-ownership
    phrase: basket has discount
    note: The current interpretation treats discount as basket context, but discount could become a separate model concept if richer discount behaviour is introduced.
    options:
      - Keep discount as basket context.
      - Promote discount to a separate model concept with amount and lifecycle.

notes:
  - The example uses finite states for broad basket lifecycle and context for quantities, totals, discount, and UI signals.
  - Facts preserve authored domain language and provide reviewable anchors for guards, effects, and invariants.
  - The projected XState model would compile transitions into state-level event handlers and context assignments.
